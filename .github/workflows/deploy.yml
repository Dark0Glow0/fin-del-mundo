# Publica el juego en GitHub Pages cada vez que se sube un cambio a main
name: Publicar en GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:          # permite publicar a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Construir el juego
        run: npm run build
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Subir la carpeta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4